# INSIGHT 관리화면 설정
# ------------------------------------------------------------------
# 이 파일이 관리화면의 입력 폼을 만든다. 필드를 늘리려면 여기만 고친다.
# 저장소에 그대로 커밋되므로 비밀값을 쓰지 말 것.

backend:
  name: github
  repo: hyun-tag8/tag-eight-web
  branch: main
  # GitHub 로그인 창구. Cloudflare Pages Functions 가 처리한다(functions/api/oauth).
  #
  # ⚠️ 지금은 도메인 연결 전이라 .pages.dev 주소를 쓴다.
  #    tag-8.com 을 연결한 뒤에는 이 줄과 GitHub OAuth App 의 callback URL 을
  #    양쪽 다 https://tag-8.com 으로 바꾼다. (한 줄 + 한 칸)
  base_url: https://tag-8.com
  auth_endpoint: api/oauth

# 로컬에서 `npm run dev` 중일 때는 브라우저에서 바로 파일을 고친다(로그인 불필요).
local_backend: true

publish_mode: simple

# 본문에 넣은 이미지는 여기에 올라간다.
# 본문에서는 /img/insight/파일명 으로 참조된다(public_folder).
#
# ⚠️ 압축 규칙은 public/img/insight/README.md 참조.
#    긴 변 1600px · WebP · 300KB 이하. 원본을 그대로 올리면 사이트가 무거워진다.
media_folder: public/img/insight
public_folder: /img/insight

# 화면 문구
site_url: https://tag-8.com
logo_url: /favicon.svg

collections:
  - name: insight
    label: INSIGHT 記事
    label_singular: 記事
    folder: src/content/insight
    create: true
    # 파일명 = 날짜 + 식별자 + 언어. 같은 글의 다른 언어판은 postId 를 같게 쓴다.
    slug: '{{year}}-{{month}}-{{day}}-{{fields.postId}}-{{fields.lang}}'
    # 목록 한 줄. 언어·분류·비공개 여부가 한눈에 보여야 「어느 글이 어디까지 나갔나」를 안다
    summary: '{{fields.lang}} · {{fields.category}}{{#if fields.draft}} · 下書き{{/if}} — {{title}}'
    sortable_fields: ['date', 'title', 'lang']
    view_filters:
      - label: 解説記事
        field: category
        pattern: guide
      - label: 韓国
        field: category
        pattern: korea
      - label: 台湾
        field: category
        pattern: taiwan
      - label: お知らせ
        field: category
        pattern: notice
      - label: 日本語
        field: lang
        pattern: ja
      - label: 한국어
        field: lang
        pattern: ko
      - label: 繁體中文
        field: lang
        pattern: zh-tw
      - label: 下書き
        field: draft
        pattern: true
    fields:
      - label: 言語
        name: lang
        widget: select
        options:
          - { label: 日本語, value: ja }
          - { label: 한국어, value: ko }
          - { label: 繁體中文, value: 'zh-tw' }
        default: ja
        hint: >-
          まず日本語で出し、翻訳は後から足せます。
          同じ記事の他言語版をつくるときは、下の「記事ID」を同じ値にしてください（言語切替がつながります）。

      # ⚠ 선택지를 늘리면 src/content.config.ts 의 z.enum 도 함께 고쳐야 한다.
      #   한쪽만 고치면 관리화면에서는 고를 수 있는데 빌드가 깨진다.
      - label: どこに載せるか（分類）
        name: category
        widget: select
        options:
          - { label: '解説記事（GUIDE）— INSIGHT上部に常設', value: guide }
          - { label: '韓国インサイト — /insight/korea', value: korea }
          - { label: '台湾インサイト — /insight/taiwan', value: taiwan }
          - { label: 'お知らせ — /insight/notice', value: notice }
        default: korea
        hint: >-
          【解説記事】NAVERブログとは・インフルエンサー起用とは、のような常設の解説。
          検索や生成AIから来た方の着地点になり、INSIGHTページの上部に固定されます。時期で古びない内容を。
          【韓国／台湾インサイト】市場の動き・調査・考察。分類ごとの一覧に最新5件が並びます。
          【お知らせ】受注・発表・実績公開など。※進行中の案件は書きません（守秘義務）。

      - label: 記事ID
        name: postId
        widget: string
        pattern: ['^[a-z0-9-]+$', '半角英小文字・数字・ハイフンのみ']
        hint: >-
          URL になります。例）naver-ai-tab → /insight/naver-ai-tab
          ※ korea / taiwan / notice は分類一覧のURLです。この3つは記事IDに使えません（ページが生成されません）。

      - label: タイトル
        name: title
        widget: string

      - label: 一行要約
        name: excerpt
        widget: text
        required: false
        hint: >-
          検索結果とSNSシェアに出る一文です。60〜90字目安。
          ※ 分類一覧には出ません（そこはタイトルとタグだけ）。解説記事では特に大事です。

      - label: 公開日
        name: date
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: false

      - label: タグ
        name: tags
        widget: list
        required: false
        default: []
        hint: >-
          「どの手段の話か」を書きます。1〜2つまで。
          例）NAVER戦略 / インフルエンサー起用 / PPL / プレスリリース / Instagram戦略 / KOL起用
          ※「韓国市場」「台湾市場」など市場名は入れないでください。分類がすでに市場を示しているため重複します。

      - label: トップの大きなカードの背景画像
        name: cover
        widget: image
        required: false
        hint: >-
          その分類の最新記事は、INSIGHTページの一番上に大きく表示されます。
          ここに画像を入れると、その背景になります。
          ※ 入れなくても構いません。無い場合は黒地のまま、崩れません。
          ※ 横長（16:9前後）・長辺1600px・WebP・300KB以下を推奨。

      - label: 一覧の先頭に固定
        name: featured
        widget: boolean
        default: false
        hint: >-
          日付に関係なく、その分類の先頭に置きます。
          ※ 複数の記事に付けると効果が薄れます。分類ごとに1件までを目安に。

      - label: 下書き（公開しない）
        name: draft
        widget: boolean
        default: true
        hint: >-
          チェックを外すと公開されます。書きかけの間は付けたままにしてください。
          ※ 公開すると、発行から7日間だけ一覧に「NEW」が付きます。

      - label: 本文
        name: body
        widget: markdown
        hint: >-
          画像はツールバーの画像ボタン、またはファイルをドラッグして入れられます。
          入れたあと、すぐ次の行に *キャプション* を書くと写真の説明になります。
          ※ 画像の中の文字は検索・生成AIが読めません。数字と結論は必ず本文か表に置いてください。
          ※ アップロード前に長辺1600px・WebP・300KB以下に圧縮してください（squoosh.app）。
